/api/v1/health:
  get:
    tags:
      - Health
    summary: Health check endpoint
    description: Returns the health status of the API server
    responses:
      '200':
        description: Server is healthy
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: "healthy"
                timestamp:
                  type: string
                  format: date-time
                  example: "2024-01-01T12:00:00.000Z"
                version:
                  type: string
                  example: "1.0.0"
                uptime:
                  type: number
                  example: 3600
            examples:
              healthy:
                summary: Healthy response
                value:
                  status: "healthy"
                  timestamp: "2024-01-01T12:00:00.000Z"
                  version: "1.0.0"
                  uptime: 3600
      '503':
        description: Server is unhealthy
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'