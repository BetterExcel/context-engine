paths:
  /api/v1/enhanced-context/analyze:
    post:
      tags:
        - Enhanced Context Analysis
      summary: Comprehensive enhanced context analysis
      description: |
        Performs advanced contextual understanding analysis using all enhanced intelligence services.
        Provides superior spreadsheet analysis with domain intelligence, auto-selection, and agent prompts.
      operationId: analyzeEnhancedContext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - request
                - spreadsheetId
                - currentSelection
              properties:
                request:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: User's analysis request or question
                  example: "Calculate portfolio risk-adjusted returns and identify optimization opportunities"
                spreadsheetId:
                  type: string
                  pattern: '^sheet_\d+_[a-z0-9]+$'
                  description: Unique identifier for the uploaded spreadsheet
                  example: "sheet_123_abc456"
                currentSelection:
                  type: object
                  required:
                    - sheet
                    - range
                    - activeCell
                  properties:
                    sheet:
                      type: string
                      description: Name of the active sheet
                      example: "Portfolio"
                    range:
                      type: string
                      description: Selected cell range
                      example: "A1:F20"
                    activeCell:
                      type: string
                      description: Currently active cell
                      example: "A1"
                    visibleRange:
                      type: string
                      description: Currently visible range (optional)
                      example: "A1:J30"
                analysisOptions:
                  type: object
                  properties:
                    enableDomainIntelligence:
                      type: boolean
                      default: true
                      description: Enable domain-specific intelligence analysis
                    enableAutoSelection:
                      type: boolean
                      default: true
                      description: Enable intelligent auto-selection of relevant data
                    enableAgentPrompts:
                      type: boolean
                      default: true
                      description: Generate comprehensive agent prompts
                    enablePerformanceOptimization:
                      type: boolean
                      default: true
                      description: Apply performance optimization strategies
                    analysisDepth:
                      type: string
                      enum: [basic, detailed, comprehensive]
                      default: detailed
                      description: Depth of analysis to perform
                    confidenceThreshold:
                      type: number
                      minimum: 0
                      maximum: 1
                      default: 0.7
                      description: Minimum confidence threshold for results
                    includeExplanations:
                      type: boolean
                      default: true
                      description: Include detailed explanations and debug information
                userContext:
                  type: object
                  properties:
                    sessionId:
                      type: string
                      description: User session identifier
                    recentActions:
                      type: array
                      items:
                        type: object
                      description: Recent user actions for context
                    domainExpertise:
                      type: string
                      enum: [novice, intermediate, expert]
                      description: User's domain expertise level
                    preferences:
                      type: object
                      properties:
                        responseFormat:
                          type: string
                          enum: [concise, detailed, comprehensive]
                          description: Preferred response format
                        includeFormulas:
                          type: boolean
                          description: Include Excel formulas in response
                        includeValidation:
                          type: boolean
                          description: Include validation steps
      responses:
        '200':
          description: Enhanced context analysis completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      intelligenceAnalysis:
                        type: object
                        properties:
                          enhancementSummary:
                            type: object
                            properties:
                              totalCellsAnalyzed:
                                type: integer
                                example: 200
                              companiesRecognized:
                                type: integer
                                example: 15
                              qualityScore:
                                type: number
                                example: 0.92
                              anomaliesDetected:
                                type: integer
                                example: 2
                          recommendations:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  example: "data_quality"
                                priority:
                                  type: string
                                  example: "high"
                                title:
                                  type: string
                                  example: "Improve data consistency"
                                description:
                                  type: string
                                actionItems:
                                  type: array
                                  items:
                                    type: string
                      domainIntelligence:
                        type: object
                        properties:
                          classification:
                            type: object
                            properties:
                              primaryDomain:
                                type: string
                                example: "FINANCIAL"
                              confidence:
                                type: number
                                example: 0.95
                              subDomains:
                                type: array
                                items:
                                  type: string
                          analysis:
                            type: object
                            properties:
                              applicableMetrics:
                                type: array
                                items:
                                  type: object
                              suggestedFormulas:
                                type: array
                                items:
                                  type: object
                              businessInsights:
                                type: array
                                items:
                                  type: object
                      intentAnalysis:
                        type: object
                        properties:
                          intent:
                            type: object
                            properties:
                              primaryIntent:
                                type: string
                                example: "PORTFOLIO_ANALYSIS"
                              confidence:
                                type: object
                                properties:
                                  overall:
                                    type: number
                                    example: 0.89
                          debugInfo:
                            type: object
                            description: Detailed analysis information (when includeExplanations is true)
                      autoSelection:
                        type: object
                        properties:
                          selectedRange:
                            type: string
                            example: "B2:F20"
                          confidence:
                            type: number
                            example: 0.87
                          explanation:
                            type: string
                            example: "Selected portfolio data based on financial analysis intent"
                          alternativeSelections:
                            type: array
                            items:
                              type: string
                      contextSynthesis:
                        type: object
                        properties:
                          summary:
                            type: string
                            example: "Portfolio analysis of 19 holdings with focus on risk-adjusted returns"
                          insights:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                description:
                                  type: string
                                confidence:
                                  type: number
                          risks:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                description:
                                  type: string
                                severity:
                                  type: string
                          opportunities:
                            type: array
                            items:
                              type: object
                          nextSteps:
                            type: array
                            items:
                              type: object
                              properties:
                                action:
                                  type: string
                                priority:
                                  type: string
                      agentPrompt:
                        type: object
                        properties:
                          summary:
                            type: string
                            example: "Calculate portfolio metrics and generate rebalancing recommendations"
                          detailedInstructions:
                            type: string
                          stepByStepActions:
                            type: array
                            items:
                              type: object
                              properties:
                                step:
                                  type: integer
                                action:
                                  type: string
                                description:
                                  type: string
                          excelFormulas:
                            type: array
                            items:
                              type: object
                              properties:
                                formula:
                                  type: string
                                  example: "=SUMPRODUCT(D2:D20,E2:E20)/SUM(E2:E20)"
                                description:
                                  type: string
                                cellReference:
                                  type: string
                          validationSteps:
                            type: array
                            items:
                              type: object
                          expectedOutcome:
                            type: object
                            properties:
                              description:
                                type: string
                              successCriteria:
                                type: array
                                items:
                                  type: string
                      performance:
                        type: object
                        properties:
                          processingTime:
                            type: integer
                            example: 2847
                          optimization:
                            type: object
                          metrics:
                            type: object
                            properties:
                              cellsAnalyzed:
                                type: integer
                              qualityScore:
                                type: number
                              confidenceScore:
                                type: number
                  requestId:
                    type: string
                    example: "enh_ctx_1640995200000_abc123"
                  processingTime:
                    type: integer
                    example: 2847
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Spreadsheet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/enhanced-context/domain-analysis:
    post:
      tags:
        - Enhanced Context Analysis
      summary: Domain-specific intelligence analysis
      description: |
        Performs focused domain intelligence analysis to classify the spreadsheet data
        and provide domain-specific metrics, KPIs, and recommendations.
      operationId: analyzeDomain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - spreadsheetId
              properties:
                spreadsheetId:
                  type: string
                  pattern: '^sheet_\d+_[a-z0-9]+$'
                  description: Unique identifier for the uploaded spreadsheet
                analysisOptions:
                  type: object
                  properties:
                    includeFinancialMetrics:
                      type: boolean
                      default: true
                      description: Include financial domain metrics
                    includeBusinessKPIs:
                      type: boolean
                      default: true
                      description: Include business KPI recommendations
                    includeRiskAssessment:
                      type: boolean
                      default: true
                      description: Include risk assessment analysis
      responses:
        '200':
          description: Domain analysis completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      domainClassification:
                        type: object
                        properties:
                          primaryDomain:
                            type: string
                            example: "FINANCIAL"
                          subDomains:
                            type: array
                            items:
                              type: string
                          confidence:
                            type: number
                            example: 0.92
                      domainAnalysis:
                        type: object
                      applicableMetrics:
                        type: array
                        items:
                          type: object
                      suggestedFormulas:
                        type: array
                        items:
                          type: object
                      kpiRecommendations:
                        type: array
                        items:
                          type: object
                      businessInsights:
                        type: array
                        items:
                          type: object
                      riskAssessment:
                        type: object
                  requestId:
                    type: string
                  processingTime:
                    type: integer

  /api/v1/enhanced-context/auto-select:
    post:
      tags:
        - Enhanced Context Analysis
      summary: Intelligent auto-selection
      description: |
        Performs intelligent auto-selection of relevant data ranges based on user query
        and spreadsheet content analysis.
      operationId: autoSelect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
                - spreadsheetId
                - currentSelection
              properties:
                query:
                  type: string
                  minLength: 1
                  description: User query for data selection
                  example: "Find companies with revenue above 50 billion"
                spreadsheetId:
                  type: string
                  pattern: '^sheet_\d+_[a-z0-9]+$'
                currentSelection:
                  type: object
                  required:
                    - sheet
                    - range
                    - activeCell
                  properties:
                    sheet:
                      type: string
                    range:
                      type: string
                    activeCell:
                      type: string
                selectionOptions:
                  type: object
                  properties:
                    expandRelated:
                      type: boolean
                      default: true
                      description: Expand selection to include related data
                    includeHeaders:
                      type: boolean
                      default: true
                      description: Include headers in selection
                    maxSelections:
                      type: integer
                      minimum: 1
                      maximum: 10
                      default: 5
                      description: Maximum number of selection alternatives
      responses:
        '200':
          description: Auto-selection completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      query:
                        type: string
                      intentAnalysis:
                        type: object
                        properties:
                          primaryIntent:
                            type: string
                          confidence:
                            type: number
                      selections:
                        type: array
                        items:
                          type: object
                          properties:
                            range:
                              type: string
                            confidence:
                              type: number
                            matchType:
                              type: string
                            explanation:
                              type: string
                            relevantColumns:
                              type: array
                              items:
                                type: object
                      recommendedSelection:
                        type: object
                        nullable: true
                  requestId:
                    type: string
                  processingTime:
                    type: integer

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "SPREADSHEET_NOT_FOUND"
            message:
              type: string
              example: "Spreadsheet not found or has expired"
            details:
              type: object
            suggestions:
              type: array
              items:
                type: string
            timestamp:
              type: string
              format: date-time
        requestId:
          type: string
        processingTime:
          type: integer